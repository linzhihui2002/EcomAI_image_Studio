# ============================================================
# EcomAI Studio 前端 Nginx 配置
# - 托管 Vue 3 SPA 静态资源（含 gzip 预压缩文件）
# - 将 /api 反向代理到后端容器（backend:5001）
# - 对 SSE 长连接关闭响应缓冲
# ============================================================

# Docker 内置 DNS，配合变量式 proxy_pass 实现后端地址动态解析：
# 后端容器重建换 IP 后无需重启 nginx
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传接口存在分片/整包图片，放宽请求体上限（后端默认上限 50MB）
    client_max_body_size 100m;

    # 访问日志输出到容器标准输出
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # ---------- 静态资源压缩 ----------
    gzip on;
    # 直接命中 vite-plugin-compression 预生成的 .gz 文件，省去运行时压缩开销
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # ---------- SSE 任务进度推送 ----------
    # 必须关闭缓冲，否则进度事件会被 nginx 攒够缓冲区才下发
    location /api/v1/sse/ {
        set $api_upstream http://backend:5001;

        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- 后端 API ----------
    location /api/ {
        set $api_upstream http://backend:5001;

        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        # 生图 / 文档解析链路耗时较长，与后端 600s 超时对齐
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # ---------- 容器健康检查 ----------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------- 带哈希指纹的静态资源：长缓存 ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- 入口 HTML：不缓存，保证发版后立即生效 ----------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- SPA 前端路由回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
